<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Overview{% endblock %} | CommsAlign</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='worksheet.css') }}">
  <script defer src="{{ url_for('static', filename='worksheet.js') }}"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ url_for('overview') }}">
        <svg aria-hidden="true" viewBox="195 95 470 355" width="37" height="28">
          <path d="M514 164C423 62 238 112 218 263C195 422 386 495 491 376C402 443 267 399 264 289C259 171 397 106 514 164Z" fill="#17365D"/>
          <g fill="none" stroke="#2E8B8B" stroke-linecap="round" stroke-linejoin="round">
            <path d="M388 412C425 340 477 229 519 141C524 130 531 131 535 143C563 237 593 340 627 405" stroke-width="23"/>
            <path d="M361 346C436 314 531 352 640 291" stroke-width="15"/>
          </g>
        </svg>
        CommsAlign
      </a>
      <nav aria-label="Main navigation">
        {% for route, label in [('overview','Overview'), ('coach','Message Coach'), ('diagnostic','Team Diagnostic')] %}
        <a href="{{ url_for(route) }}"{% if page == route %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main class="shell" id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer shell"><strong>CommsAlign</strong><span>Class prototype · Workplace communication</span></footer>
</body>
</html>
