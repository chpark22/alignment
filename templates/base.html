<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Overview{% endblock %} | CommsAlign</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='aligned-ca.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='worksheet.css') }}">
  <script defer src="{{ url_for('static', filename='worksheet.js') }}"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ url_for('overview') }}">
        <img src="{{ url_for('static', filename='aligned-ca.svg') }}" width="35" height="28" alt="">
        CommsAlign
      </a>
      <nav aria-label="Main navigation">
        {% for route, label in [('overview','Overview'), ('coach','Message Coach'), ('diagnostic','Team Diagnostic')] %}
        <a href="{{ url_for(route) }}"{% if page == route %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main class="shell" id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer shell"><strong>CommsAlign</strong><span>Class prototype · Workplace communication</span></footer>
</body>
</html>
